defaults:
  - _self_
  - datapaths: datapaths
  - defaults

# Dataverse configuration for downloading data
dataverse:
  baseurl: https://dataverse.harvard.edu
  pid: doi:10.7910/DVN/F6PQAA

# input data configuration
data:
  # spatial levels to process (output format names)
  spatial_levels: [block_group, tract, county, state, zcta]
  
  # Year range for data processing
  year_min: 2000
  year_max: 2019
  
  # type casting 
  dtype_dict:
    year: int
    br: float
    ca: float
    cu: float
    ec: float
    fe: float
    k: float
    nh4: float
    ni: float
    no3: float
    oc: float
    pb: float
    si: float
    so4: float
    v: float
    zn: float
    zcta: str
    county: str
    tract: str
    state: str
    block_group: str

# mappings between desired output names and input filename prefixes
file_mappings:
  zcta: zctas
  county: counties
  tract: tracts
  state: states
  block_group: block-groups

# ID column mappings for each spatial level 
id_column_mappings:
  block_group: 
    "2000": BKGPIDFP00
    "2010": GEOID10
  tract:
    "2000": CTIDFP00
    "2010": GEOID10
  county:
    "2000": CNTYIDFP00
    "2010": GEOID10
  state:
    "2000": STATEFP00
    "2010": GEOID10
  zcta:
    "2000": ZCTA5CE00
    "2010": ZCTA5CE10

# Decade splitting configuration for processing
decades:
  "2000": [2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009]
  "2010": [2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019]