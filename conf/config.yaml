defaults:
  - _self_
  - datapaths: datapaths

# Dataverse configuration for downloading data
dataverse:
  baseurl: https://dataverse.harvard.edu
  pid: doi:10.7910/DVN/F6PQAA

# PM2.5 Components data configuration
data:
  # Spatial levels to process
  spatial_levels: [block-groups, tracts, counties, states, zctas]
  
  # Year range for data processing
  year_min: 2000
  year_max: 2019
  
  # Data type specifications
  dtype_dict:
    # Common columns across all spatial levels
    year: int
    br: float
    ca: float
    cu: float
    ec: float
    fe: float
    k: float
    nh4: float
    ni: float
    no3: float
    oc: float
    pb: float
    si: float
    so4: float
    v: float
    zn: float
    # ID columns (spatial identifiers) - cast as strings
    zcta: str
    county: str
    tract: str
    state: str
    block_group: str
  
  # Base name for the dataset
  base_name: pm25_components__schwartz

# File mappings between spatial level names and actual filenames
# Key: desired output name (singular), Value: input filename prefix (plural)
file_mappings:
  zcta: zctas
  county: counties
  tract: tracts
  state: states
  block_group: block-groups

# ID column mappings for each spatial level (using output names as keys)
id_column_mappings:
  block_group: 
    "2000": BKGPIDFP00
    "2010": GEOID10
  tract:
    "2000": CTIDFP00
    "2010": GEOID10
  county:
    "2000": CNTYIDFP00
    "2010": GEOID10
  state:
    "2000": STATEFP00
    "2010": GEOID10
  zcta:
    "2000": ZCTA5CE00
    "2010": ZCTA5CE10

# Processing configuration
processing:
  # Input directory structure
  input_dir: data/input/pm25_components__randall__raw/block-groups-tracts-counties-states-zctas-2000-2010
  
  # Output directory structure
  output_dir: output
  
  # Output format
  output_format: parquet  # or csv
  
  # Decade splitting configuration
  decades:
    "2000": [2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009]
    "2010": [2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019]